[package]
name = "copperroute"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "copperroute"
path = "src/lib.rs"

[[bin]]
name = "copperroute"
path = "src/main.rs"

[dependencies]
copper-geometry = { path = "../copper-geometry" }
copper-settings = { path = "../copper-settings" }
copper-core = { path = "../copper-core", features = ["gpu"] }
copper-gpu = { path = "../copper-gpu" }
copper-dsn = { path = "../copper-dsn" }
copper-board = { path = "../copper-board" }
copper-drc = { path = "../copper-drc" }
copper-router = { path = "../copper-router" }
copper-governor = { path = "../copper-governor" }
copper-morph = { path = "../copper-morph" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
testkit = { path = "../../tests/testkit" }
